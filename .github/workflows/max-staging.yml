name: MAX staging validation
on:
  push:
    branches: [feature/max-notifications-staging, fix/bothost-entrypoint]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python syntax
        run: python -m compileall -q run_combined.py gmail_bot.py max_notify_format.py patch_max_client.py test_combined.py test_max_format.py
      - name: Test launcher
        run: python -m unittest -v test_combined.py test_max_format.py
      - name: Test pinned Docker build
        run: docker build --progress=plain -t vk-max-staging:${{ github.sha }} .
      - name: Smoke test startup with Bothost-style bind mount
        run: |
          mkdir -p data
          docker run --rm -v "$PWD:/app" vk-max-staging:${{ github.sha }} \
            python -c "import os; from pathlib import Path; assert os.geteuid() != 0; assert Path('/opt/max2tg/app/main.py').is_file(); assert Path('/app/run_combined.py').is_file(); print('bothost bind mount smoke test passed')"
